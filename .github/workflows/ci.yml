name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --dev

      - name: Install langchain extra
        run: uv sync --group dev --extra langchain

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Type check (ty)
        run: uv run ty
        continue-on-error: true  # ty is a Rust-based type checker still evolving

      - name: Test (pytest)
        run: uv run pytest --ignore=tests/test_validator_wiring.py --ignore=tests/test_lookups_contract.py --ignore=tests/test_dashboard.py --timeout=30 -x -v