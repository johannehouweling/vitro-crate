name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            When the diff includes test files, additionally flag these test-quality
            defects (report only high-confidence, correctness-relevant ones — ignore style):
            - assert-back-fixture: an assertion echoes a value the test set in its own
              setup/fixture, with no transformation in between.
            - bypasses-producer: the test's name/docstring claims build or extraction
              coverage but it hand-builds the expected state (or scripts the drafters)
              and never drives the real entry point (e.g. run_pipeline / the transform
              under test).
            - over-mock / stub-assert: a behaviour test that only asserts a mock's
              configured return value, or asserts against a stub.
            - name-claims-more-than-body: the assertion is materially weaker than the
              test name/docstring promises.
            The honest pattern to compare against: drive the real entry point over
            real/recorded input, gate any leaf stub on content-only tokens, and assert
            on what was produced (see tests/test_pipeline_real_input.py).
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

