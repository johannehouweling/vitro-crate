name: Calibrate test durations

# Regenerates `.test_durations` from REAL runner timings. CI's `test` job shards
# with pytest-split's `least_duration`, which balances by the committed durations
# — but those drift, and a LOCAL-measured file mis-balances the runner (the 2-vCPU
# runner scales the eval suite worse than local). Running the suite once ON the
# runner with --store-durations produces a file that balances the shards evenly.
#
# Usage: MANUAL only — trigger from the Actions tab ("Run workflow", pick the
# branch). Download the `test-durations` artifact (test_durations.json) and commit
# it as `.test_durations`. Re-run whenever the shard balance drifts.
on:
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    # The whole suite, serial, on a 2-vCPU runner. It was 60 when the suite was
    # ~1100 recorded tests; it is now 2113 and the export-heavy tail got slower
    # (every export runs the full severity sweep, #446), so 60 no longer clears it.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --dev --extra langchain

      - name: Measure runner durations (full suite, serial)
        # No --ignore, matching the `test` job exactly (#456 retired the last of
        # them), so the recorded set is exactly what gets sharded. A module the
        # sharded job runs but this one skips would be balanced blind.
        # Generous --timeout=120 so a test that is slow on the
        # runner is MEASURED, not killed (the sharded job keeps its tight
        # --timeout=30). Serial (no -n) so each test's recorded duration is its
        # true single-process runner cost. `|| true` so a stray failure still lets
        # us upload the durations collected so far.
        run: >-
          uv run pytest
          --timeout=120
          --store-durations
          --durations-path .test_durations
          -p no:cacheprovider
          -q
          || true

      - name: Stage durations under a non-hidden name
        # actions/upload-artifact v4+ EXCLUDES dotfiles by default, so a path of
        # `.test_durations` uploads nothing ("No files were found"). Copy it to a
        # visible name so the artifact is always captured.
        if: always()
        run: cp .test_durations test_durations.json || true

      - name: Upload calibrated durations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-durations
          path: test_durations.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 5
