id: https://w3id.org/ro/crate/isa/1.0
name: isa_rocrate_profile
description: >-
  ISA RO-Crate Profile schema. Single source of truth for SHACL shape generation.
  Version 1.0.0-draft.1

prefixes:
  schema: http://schema.org/
  bioschemas: https://bioschemas.org/
  isa: https://w3id.org/ro/crate/isa/1.0/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  sh: http://www.w3.org/ns/shacl#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#

imports:
  - linkml:types

default_range: string

# =============================================================================
# Profile metadata (used by build_shapes.py to generate profile.ttl)
# =============================================================================
annotations:
  profile_uri: "https://w3id.org/ro/crate/isa/1.0"
  profile_label: "ISA RO-Crate Profile"
  profile_comment: "Profile for ISA-based RO-Crates, version 1.0.0-draft.1"
  profile_token: "isa-rocrate"
  profile_is_profile_of: "https://w3id.org/ro/crate/1.1"

# =============================================================================
# Classes
# =============================================================================
classes:

  # --------------------------------------------------------------------------
  # Investigation
  # --------------------------------------------------------------------------
  Investigation:
    class_uri: schema:Dataset
    description: "An ISA Investigation represents the root data entity"
    annotations:
      target_class: schema:Dataset
      discriminator_path: schema:additionalType
      discriminator_value: Investigation
      shape_name: InvestigationShape
      shape_prefix: isa
    attributes:
      investigation_additionalType:
        slot_uri: schema:additionalType
        annotations:
          severity: MUST
          has_value: Investigation
          message: "Set schema:additionalType to 'Investigation' (xsd:string) to identify this Dataset as an ISA Investigation"
      investigation_identifier:
        slot_uri: schema:identifier
        annotations:
          severity: MUST
          min_count: 1
          message: "Add at least one schema:identifier (xsd:string or IRI) to the Investigation"
      investigation_name:
        slot_uri: schema:name
        range: string
        annotations:
          severity: MUST
          min_count: 1
          sh_datatype: xsd:string
          message: "Add a schema:name (xsd:string) with the Investigation title"
      investigation_description:
        slot_uri: schema:description
        range: string
        annotations:
          severity: MUST
          min_count: 1
          sh_datatype: xsd:string
          message: "Add a schema:description (xsd:string) to the Investigation"
      investigation_license:
        slot_uri: schema:license
        annotations:
          severity: MUST
          min_count: 1
          message: "Add a schema:license (xsd:string or IRI); use 'ALL RIGHTS RESERVED BY THE AUTHORS' if none available"
      investigation_datePublished:
        slot_uri: schema:datePublished
        annotations:
          severity: MUST
          min_count: 1
          datatype_union: "xsd:date|xsd:dateTime|xsd:string"
          message: "Add a schema:datePublished (ISO 8601 date string) to the Investigation"
      # SHOULD
      investigation_dateCreated:
        slot_uri: schema:dateCreated
        annotations:
          severity: SHOULD
          datatype_union: "xsd:date|xsd:dateTime|xsd:string"
          message: "Add a schema:dateCreated (ISO 8601 date string) indicating when the Investigation was created"
      investigation_creator:
        slot_uri: schema:creator
        annotations:
          severity: SHOULD
          sh_class: schema:Person
          message: "Add at least one schema:creator linking to a schema:Person entity"
      investigation_hasPart:
        slot_uri: schema:hasPart
        annotations:
          severity: SHOULD
          sh_class: schema:Dataset
          message: "Add schema:hasPart linking to schema:Dataset entities representing Studies"
      # MAY
      investigation_citation:
        slot_uri: schema:citation
        annotations:
          severity: MAY
          sh_class: schema:ScholarlyArticle
          message: "Add schema:citation linking to schema:ScholarlyArticle entities for related publications"
      investigation_comment:
        slot_uri: schema:comment
        annotations:
          severity: MAY
          sh_class: schema:Comment
          message: "Add schema:comment linking to schema:Comment entities"
      investigation_dateModified:
        slot_uri: schema:dateModified
        annotations:
          severity: MAY
          datatype_union: "xsd:date|xsd:dateTime|xsd:string"
          message: "Add a schema:dateModified (ISO 8601 date string) if the Investigation has been modified"
      investigation_mentions:
        slot_uri: schema:mentions
        annotations:
          severity: MAY
          sh_class: schema:DefinedTermSet
          message: "Add schema:mentions linking to schema:DefinedTermSet entities for ontologies referenced in this Investigation"
      investigation_url:
        slot_uri: schema:url
        annotations:
          severity: MAY
          node_kind: sh:IRI
          message: "Add a schema:url (IRI) pointing to the Investigation metadata file"

  # --------------------------------------------------------------------------
  # Study
  # --------------------------------------------------------------------------
  Study:
    class_uri: schema:Dataset
    description: "An ISA Study within an Investigation"
    annotations:
      target_class: schema:Dataset
      discriminator_path: schema:additionalType
      discriminator_value: Study
      shape_name: StudyShape
      shape_prefix: isa
    attributes:
      study_additionalType:
        slot_uri: schema:additionalType
        annotations:
          severity: MUST
          has_value: Study
          message: "Set schema:additionalType to 'Study' (xsd:string) to identify this Dataset as an ISA Study"
      study_identifier:
        slot_uri: schema:identifier
        annotations:
          severity: MUST
          min_count: 1
          message: "Add at least one schema:identifier (xsd:string or IRI) to the Study"
      study_name:
        slot_uri: schema:name
        range: string
        annotations:
          severity: MUST
          min_count: 1
          sh_datatype: xsd:string
          message: "Add a schema:name (xsd:string) with the Study title"
      # SHOULD
      study_creator:
        slot_uri: schema:creator
        annotations:
          severity: SHOULD
          sh_class: schema:Person
          message: "Add at least one schema:creator linking to a schema:Person entity who performed the study"
      study_description:
        slot_uri: schema:description
        annotations:
          severity: SHOULD
          sh_datatype: xsd:string
          message: "Add a schema:description (xsd:string) to the Study"
      study_about:
        slot_uri: schema:about
        annotations:
          severity: SHOULD
          sh_class: bioschemas:LabProcess
          message: "Add schema:about linking to bioschemas:LabProcess entities describing experimental processes"
      study_dateCreated:
        slot_uri: schema:dateCreated
        annotations:
          severity: SHOULD
          datatype_union: "xsd:date|xsd:dateTime|xsd:string"
          message: "Add a schema:dateCreated (ISO 8601 date string) indicating when the Study was created"
      study_datePublished:
        slot_uri: schema:datePublished
        annotations:
          severity: SHOULD
          datatype_union: "xsd:date|xsd:dateTime|xsd:string"
          message: "Add a schema:datePublished (ISO 8601 date string) indicating when the Study was published"
      study_hasPart:
        slot_uri: schema:hasPart
        annotations:
          severity: SHOULD
          class_union: "schema:Dataset|schema:MediaObject"
          message: "Add schema:hasPart linking to schema:Dataset (Assay) or schema:MediaObject (data file) entities"
      # MAY
      study_citation:
        slot_uri: schema:citation
        annotations:
          severity: MAY
          sh_class: schema:ScholarlyArticle
          message: "Add schema:citation linking to schema:ScholarlyArticle entities for related publications"
      study_comment:
        slot_uri: schema:comment
        annotations:
          severity: MAY
          sh_class: schema:Comment
          message: "Add schema:comment linking to schema:Comment entities"
      study_dateModified:
        slot_uri: schema:dateModified
        annotations:
          severity: MAY
          datatype_union: "xsd:date|xsd:dateTime|xsd:string"
          message: "Add a schema:dateModified (ISO 8601 date string) if the Study has been modified"
      study_url:
        slot_uri: schema:url
        annotations:
          severity: MAY
          node_kind: sh:IRI
          message: "Add a schema:url (IRI) pointing to the Study metadata file"

  # --------------------------------------------------------------------------
  # Assay
  # --------------------------------------------------------------------------
  Assay:
    class_uri: schema:Dataset
    description: "An ISA Assay within a Study"
    annotations:
      target_class: schema:Dataset
      discriminator_path: schema:additionalType
      discriminator_value: Assay
      shape_name: AssayShape
      shape_prefix: isa
    attributes:
      assay_additionalType:
        slot_uri: schema:additionalType
        annotations:
          severity: MUST
          has_value: Assay
          message: "Set schema:additionalType to 'Assay' (xsd:string) to identify this Dataset as an ISA Assay"
      assay_identifier:
        slot_uri: schema:identifier
        annotations:
          severity: MUST
          min_count: 1
          message: "Add at least one schema:identifier (xsd:string or IRI) to the Assay"
      # SHOULD
      assay_name:
        slot_uri: schema:name
        annotations:
          severity: SHOULD
          sh_datatype: xsd:string
          message: "Add a schema:name (xsd:string) with the Assay title"
      assay_description:
        slot_uri: schema:description
        annotations:
          severity: SHOULD
          sh_datatype: xsd:string
          message: "Add a schema:description (xsd:string) to the Assay"
      assay_about:
        slot_uri: schema:about
        annotations:
          severity: SHOULD
          sh_class: bioschemas:LabProcess
          message: "Add schema:about linking to bioschemas:LabProcess entities describing experimental processes"
      assay_creator:
        slot_uri: schema:creator
        annotations:
          severity: SHOULD
          sh_class: schema:Person
          message: "Add at least one schema:creator linking to a schema:Person entity who performed the experiments"
      assay_hasPart:
        slot_uri: schema:hasPart
        annotations:
          severity: SHOULD
          sh_class: schema:MediaObject
          message: "Add schema:hasPart linking to schema:MediaObject entities for resulting data files"
      assay_measurementMethod:
        slot_uri: schema:measurementMethod
        annotations:
          severity: SHOULD
          or_union: "nodeKind:sh:IRI|class:schema:DefinedTerm"
          message: "Add a schema:measurementMethod (IRI or schema:DefinedTerm) describing the measurement type (e.g., Complexomics)"
      assay_measurementTechnique:
        slot_uri: schema:measurementTechnique
        annotations:
          severity: SHOULD
          or_union: "nodeKind:sh:IRI|class:schema:DefinedTerm"
          message: "Add a schema:measurementTechnique (IRI or schema:DefinedTerm) describing the technology used (e.g., mass spectrometry)"
      # MAY
      assay_variableMeasured:
        slot_uri: schema:variableMeasured
        annotations:
          severity: MAY
          or_union: "datatype:xsd:string|class:schema:PropertyValue"
          message: "Add schema:variableMeasured (xsd:string or schema:PropertyValue) for the target variable (e.g., protein concentration)"
      assay_comment:
        slot_uri: schema:comment
        annotations:
          severity: MAY
          sh_class: schema:Comment
          message: "Add schema:comment linking to schema:Comment entities"
      assay_url:
        slot_uri: schema:url
        annotations:
          severity: MAY
          node_kind: sh:IRI
          message: "Add a schema:url (IRI) pointing to the Assay metadata file"

  # --------------------------------------------------------------------------
  # LabProcess
  # --------------------------------------------------------------------------
  LabProcess:
    class_uri: bioschemas:LabProcess
    description: "An experimental process in ISA"
    annotations:
      target_class: bioschemas:LabProcess
      shape_name: LabProcessShape
      shape_prefix: isa
    attributes:
      labprocess_name:
        slot_uri: schema:name
        range: string
        annotations:
          severity: MUST
          min_count: 1
          sh_datatype: xsd:string
          message: "Add a schema:name (xsd:string) to the LabProcess"
      # SHOULD
      labprocess_object:
        slot_uri: schema:object
        annotations:
          severity: SHOULD
          class_union: "bioschemas:Sample|schema:MediaObject"
          message: "Add schema:object linking to bioschemas:Sample or schema:MediaObject input entities"
      labprocess_result:
        slot_uri: schema:result
        annotations:
          severity: SHOULD
          class_union: "bioschemas:Sample|schema:MediaObject"
          message: "Add schema:result linking to bioschemas:Sample or schema:MediaObject output entities"
      labprocess_agent:
        slot_uri: schema:agent
        annotations:
          severity: SHOULD
          sh_class: schema:Person
          message: "Add schema:agent linking to the schema:Person who performed this process"
      labprocess_executesLabProtocol:
        slot_uri: bioschemas:executesLabProtocol
        annotations:
          severity: SHOULD
          sh_class: bioschemas:LabProtocol
          message: "Add bioschemas:executesLabProtocol linking to the bioschemas:LabProtocol this process executes"
      labprocess_parameterValue:
        slot_uri: schema:additionalProperty
        annotations:
          severity: SHOULD
          sh_class: schema:PropertyValue
          message: "Add schema:additionalProperty linking to schema:PropertyValue entities for process parameters"
      labprocess_endTime:
        slot_uri: schema:endTime
        annotations:
          severity: SHOULD
          sh_datatype: xsd:dateTime
          message: "Add a schema:endTime (xsd:dateTime) indicating when the process completed"
      # MAY
      labprocess_disambiguatingDescription:
        slot_uri: schema:disambiguatingDescription
        annotations:
          severity: MAY
          sh_datatype: xsd:string
          message: "Add schema:disambiguatingDescription (xsd:string) for additional process comments"

  # --------------------------------------------------------------------------
  # LabProtocol
  # --------------------------------------------------------------------------
  LabProtocol:
    class_uri: bioschemas:LabProtocol
    description: "An experimental protocol in ISA"
    annotations:
      target_class: bioschemas:LabProtocol
      shape_name: LabProtocolShape
      shape_prefix: isa
    attributes:
      # SHOULD
      labprotocol_name:
        slot_uri: schema:name
        annotations:
          severity: SHOULD
          sh_datatype: xsd:string
          message: "Add a schema:name (xsd:string) with the protocol title"
      labprotocol_description:
        slot_uri: schema:description
        annotations:
          severity: SHOULD
          sh_datatype: xsd:string
          message: "Add a schema:description (xsd:string) with a short protocol description"
      labprotocol_intendedUse:
        slot_uri: schema:intendedUse
        annotations:
          severity: SHOULD
          or_union: "class:schema:DefinedTerm|datatype:xsd:string|nodeKind:sh:IRI"
          message: "Add schema:intendedUse (schema:DefinedTerm, xsd:string, or IRI) for the protocol type"
      # MAY
      labprotocol_computationalTool:
        slot_uri: schema:computationalTool
        annotations:
          severity: MAY
          or_union: "class:schema:DefinedTerm|class:schema:PropertyValue|class:schema:SoftwareApplication"
          message: "Add schema:computationalTool (schema:DefinedTerm, schema:PropertyValue, or schema:SoftwareApplication) for software used"
      labprotocol_labEquipment:
        slot_uri: schema:labEquipment
        annotations:
          severity: MAY
          or_union: "class:schema:DefinedTerm|class:schema:PropertyValue|datatype:xsd:string|nodeKind:sh:IRI"
          message: "Add schema:labEquipment (schema:DefinedTerm, schema:PropertyValue, xsd:string, or IRI) for laboratory equipment"
      labprotocol_reagent:
        slot_uri: schema:reagent
        annotations:
          severity: MAY
          or_union: "class:schema:BioChemEntity|class:schema:DefinedTerm|class:schema:PropertyValue|datatype:xsd:string|nodeKind:sh:IRI"
          message: "Add schema:reagent (schema:BioChemEntity, schema:DefinedTerm, schema:PropertyValue, xsd:string, or IRI) for reagents used"
      labprotocol_url:
        slot_uri: schema:url
        annotations:
          severity: MAY
          node_kind: sh:IRI
          message: "Add a schema:url (IRI) pointing to external protocol resources"
      labprotocol_version:
        slot_uri: schema:version
        annotations:
          severity: MAY
          or_union: "datatype:xsd:string|datatype:xsd:decimal"
          message: "Add schema:version (xsd:string or xsd:decimal) for protocol version tracking"
      labprotocol_comment:
        slot_uri: schema:comment
        annotations:
          severity: MAY
          sh_class: schema:Comment
          message: "Add schema:comment linking to schema:Comment entities"

  # --------------------------------------------------------------------------
  # Sample
  # --------------------------------------------------------------------------
  Sample:
    class_uri: bioschemas:Sample
    description: "A biological sample, source, or material in ISA"
    annotations:
      target_class: bioschemas:Sample
      shape_name: SampleShape
      shape_prefix: isa
    attributes:
      sample_name:
        slot_uri: schema:name
        range: string
        annotations:
          severity: MUST
          min_count: 1
          sh_datatype: xsd:string
          message: "Add a schema:name (xsd:string) identifying the sample"
      # SHOULD
      sample_additionalProperty:
        slot_uri: schema:additionalProperty
        annotations:
          severity: SHOULD
          sh_class: schema:PropertyValue
          message: "Add schema:additionalProperty linking to schema:PropertyValue entities for sample characteristics or factors"
      sample_derivesFrom:
        slot_uri: schema:isBasedOn
        annotations:
          severity: SHOULD
          sh_class: bioschemas:Sample
          message: "Add schema:isBasedOn linking to the parent bioschemas:Sample this sample was derived from"

  # --------------------------------------------------------------------------
  # Person
  # --------------------------------------------------------------------------
  Person:
    class_uri: schema:Person
    description: "A person in ISA"
    annotations:
      target_class: schema:Person
      shape_name: PersonShape
      shape_prefix: isa
    attributes:
      person_givenName:
        slot_uri: schema:givenName
        range: string
        annotations:
          severity: MUST
          min_count: 1
          sh_datatype: xsd:string
          message: "Add a schema:givenName (xsd:string) to the Person"
      # SHOULD
      person_familyName:
        slot_uri: schema:familyName
        annotations:
          severity: SHOULD
          sh_datatype: xsd:string
          message: "Add a schema:familyName (xsd:string) to the Person"
      person_email:
        slot_uri: schema:email
        annotations:
          severity: SHOULD
          message: "Add a schema:email (xsd:string) to the Person"
      person_affiliation:
        slot_uri: schema:affiliation
        annotations:
          severity: SHOULD
          sh_class: schema:Organization
          message: "Add schema:affiliation linking to a schema:Organization entity"
      person_identifier:
        slot_uri: schema:identifier
        annotations:
          severity: SHOULD
          or_union: "datatype:xsd:string|nodeKind:sh:IRI|class:schema:PropertyValue"
          message: "Add schema:identifier (xsd:string, IRI, or schema:PropertyValue) with a persistent identifier (e.g., ORCID)"
      person_jobTitle:
        slot_uri: schema:jobTitle
        annotations:
          severity: SHOULD
          sh_class: schema:DefinedTerm
          message: "Add schema:jobTitle as a schema:DefinedTerm describing the person's role"
      # MAY
      person_additionalName:
        slot_uri: schema:additionalName
        annotations:
          severity: MAY
          sh_datatype: xsd:string
          message: "Add schema:additionalName (xsd:string) for a middle name or other name"
      person_address:
        slot_uri: schema:address
        annotations:
          severity: MAY
          or_union: "class:schema:PostalAddress|datatype:xsd:string"
          message: "Add schema:address (schema:PostalAddress or xsd:string)"
      person_disambiguatingDescription:
        slot_uri: schema:disambiguatingDescription
        annotations:
          severity: MAY
          sh_datatype: xsd:string
          message: "Add schema:disambiguatingDescription (xsd:string) for additional person details"
      person_faxNumber:
        slot_uri: schema:faxNumber
        annotations:
          severity: MAY
          sh_datatype: xsd:string
          message: "Add schema:faxNumber (xsd:string)"
      person_telephone:
        slot_uri: schema:telephone
        annotations:
          severity: MAY
          sh_datatype: xsd:string
          message: "Add schema:telephone (xsd:string)"

  # --------------------------------------------------------------------------
  # ScholarlyArticle
  # --------------------------------------------------------------------------
  ScholarlyArticle:
    class_uri: schema:ScholarlyArticle
    description: "A publication in ISA"
    annotations:
      target_class: schema:ScholarlyArticle
      shape_name: ScholarlyArticleShape
      shape_prefix: isa
    attributes:
      article_headline:
        slot_uri: schema:headline
        range: string
        annotations:
          severity: MUST
          min_count: 1
          sh_datatype: xsd:string
          message: "Add a schema:headline (xsd:string) with the article title"
      article_identifier:
        slot_uri: schema:identifier
        annotations:
          severity: MUST
          min_count: 1
          message: "Add at least one schema:identifier (xsd:string, IRI, or schema:PropertyValue) with the DOI, PubMedID, or other article identifier"
      # SHOULD
      article_author:
        slot_uri: schema:author
        annotations:
          severity: SHOULD
          sh_class: schema:Person
          message: "Add at least one schema:author linking to a schema:Person entity"
      # MAY
      article_creativeWorkStatus:
        slot_uri: schema:creativeWorkStatus
        annotations:
          severity: MAY
          sh_class: schema:DefinedTerm
          message: "Add schema:creativeWorkStatus as a schema:DefinedTerm describing the publication lifecycle stage"
      article_comment:
        slot_uri: schema:comment
        annotations:
          severity: MAY
          sh_class: schema:Comment
          message: "Add schema:comment linking to schema:Comment entities"

  # --------------------------------------------------------------------------
  # DefinedTerm
  # --------------------------------------------------------------------------
  DefinedTerm:
    class_uri: schema:DefinedTerm
    description: "An ontology term in ISA"
    annotations:
      target_class: schema:DefinedTerm
      shape_name: DefinedTermShape
      shape_prefix: isa
    attributes:
      definedterm_name:
        slot_uri: schema:name
        range: string
        annotations:
          severity: MUST
          min_count: 1
          sh_datatype: xsd:string
          message: "Add a schema:name (xsd:string) with the ontology term name"
      # SHOULD
      definedterm_termCode:
        slot_uri: schema:termCode
        annotations:
          severity: SHOULD
          sh_datatype: xsd:string
          message: "Add a schema:termCode (xsd:string) with the term identifier within its ontology"
      # MAY
      definedterm_inDefinedTermSet:
        slot_uri: schema:inDefinedTermSet
        annotations:
          severity: MAY
          or_union: "nodeKind:sh:IRI|class:schema:DefinedTermSet"
          message: "Add schema:inDefinedTermSet (IRI or schema:DefinedTermSet) linking to the source ontology"
      definedterm_disambiguatingDescription:
        slot_uri: schema:disambiguatingDescription
        annotations:
          severity: MAY
          sh_datatype: xsd:string
          message: "Add schema:disambiguatingDescription (xsd:string) for ISA comments on this term"

  # --------------------------------------------------------------------------
  # PropertyValue
  # --------------------------------------------------------------------------
  PropertyValue:
    class_uri: schema:PropertyValue
    description: "A key-value pair in ISA"
    annotations:
      target_class: schema:PropertyValue
      shape_name: PropertyValueShape
      shape_prefix: isa
    attributes:
      pv_name:
        slot_uri: schema:name
        range: string
        annotations:
          severity: MUST
          min_count: 1
          sh_datatype: xsd:string
          message: "Add a schema:name (xsd:string) with the property key name"
      # SHOULD
      pv_value:
        slot_uri: schema:value
        annotations:
          severity: SHOULD
          message: "Add schema:value with the property value (xsd:string or number)"
      pv_propertyID:
        slot_uri: schema:propertyID
        annotations:
          severity: SHOULD
          node_kind: sh:IRI
          message: "Add schema:propertyID (IRI) linking to an ontology term for this property key"
      # MAY
      pv_additionalType:
        slot_uri: schema:additionalType
        annotations:
          severity: MAY
          or_union: "datatype:xsd:string|nodeKind:sh:IRI"
          message: "Add schema:additionalType (xsd:string or IRI) to classify this PropertyValue (e.g., ParameterValue, CharacteristicValue)"
      pv_unitCode:
        slot_uri: schema:unitCode
        annotations:
          severity: MAY
          node_kind: sh:IRI
          message: "Add schema:unitCode (IRI) linking to an ontology term for the unit"
      pv_unitText:
        slot_uri: schema:unitText
        annotations:
          severity: MAY
          sh_datatype: xsd:string
          message: "Add schema:unitText (xsd:string) with the unit name"
      pv_valueReference:
        slot_uri: schema:valueReference
        annotations:
          severity: MAY
          node_kind: sh:IRI
          message: "Add schema:valueReference (IRI) linking to an ontology term for the value"

  # --------------------------------------------------------------------------
  # Data (MediaObject)
  # --------------------------------------------------------------------------
  Data:
    class_uri: schema:MediaObject
    description: "A data file (MediaObject)"
    annotations:
      target_class: schema:MediaObject
      shape_name: DataShape
      shape_prefix: isa
    attributes:
      data_name:
        slot_uri: schema:name
        range: string
        annotations:
          severity: MUST
          min_count: 1
          sh_datatype: xsd:string
          message: "Add a schema:name (xsd:string) with the file name"
      # MAY
      data_comment:
        slot_uri: schema:comment
        annotations:
          severity: MAY
          sh_class: schema:Comment
          message: "Add schema:comment linking to schema:Comment entities"
      data_disambiguatingDescription:
        slot_uri: schema:disambiguatingDescription
        annotations:
          severity: MAY
          sh_datatype: xsd:string
          message: "Add schema:disambiguatingDescription (xsd:string) for the data type (e.g., Raw Data File, Derived Data File)"
      data_encodingFormat:
        slot_uri: schema:encodingFormat
        annotations:
          severity: MAY
          or_union: "datatype:xsd:string|nodeKind:sh:IRI"
          message: "Add schema:encodingFormat (xsd:string MIME type or IRI)"
      data_hasPart:
        slot_uri: schema:hasPart
        annotations:
          severity: MAY
          node_kind: sh:IRI
          message: "Add schema:hasPart (IRI) for data fragment selectors"
      data_usageInfo:
        slot_uri: schema:usageInfo
        annotations:
          severity: MAY
          or_union: "datatype:xsd:string|nodeKind:sh:IRI"
