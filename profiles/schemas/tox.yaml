id: https://w3id.org/ro/crate/isa-tox/1.0
name: tox_rocrate_profile
description: >-
  ISA-Tox RO-Crate Profile schema. Toxicology extension of the ISA RO-Crate Profile.
  Version 0.1-draft. Derived from models/tox.py domain classes.

prefixes:
  schema: http://schema.org/
  bioschemas: https://bioschemas.org/
  tox: https://w3id.org/ro/crate/isa-tox/1.0/
  isa: https://w3id.org/ro/crate/isa/1.0/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  sh: http://www.w3.org/ns/shacl#

imports:
  - linkml:types

default_range: string

# =============================================================================
# Profile metadata
# =============================================================================
annotations:
  profile_uri: "https://w3id.org/ro/crate/isa-tox/1.0"
  profile_label: "ISA Tox RO-Crate Profile"
  profile_comment: "Toxicology extension of the ISA RO-Crate Profile, version 0.1-draft"
  profile_token: "tox-rocrate"
  profile_is_profile_of: "https://w3id.org/ro/crate/isa/1.0"

# =============================================================================
# Classes — Tox-specific entities
# Derived from models/tox.py: MolecularEntity, CellLineSample,
# LabProcessExposure, LabProcessEndpointReadout, LabProcessCellCulture,
# LabProcessDataAnalysis
# =============================================================================
classes:

  # --------------------------------------------------------------------------
  # MolecularEntity — the test/control chemical
  # From builder.build_crate (the chemicals block)
  # Test and control chemicals are modelled as Bioschemas MolecularEntity
  # instances (rather than the broader ChemicalSubstance), so a resolvable
  # identifier makes the compound machine-actionable. Concentration is not a
  # property of the compound — it is carried per well by the Exposure's CSVW
  # condition table.
  # --------------------------------------------------------------------------
  MolecularEntity:
    class_uri: bioschemas:MolecularEntity
    description: "A chemical compound (test or control item) in a toxicology study"
    annotations:
      target_class: bioschemas:MolecularEntity
      shape_name: MolecularEntityShape
      shape_prefix: tox
    attributes:
      molent_name:
        slot_uri: schema:name
        range: string
        annotations:
          severity: MUST
          min_count: 1
          sh_datatype: xsd:string
          message: "Add a schema:name (xsd:string) with the compound name"
      # SHOULD
      molent_identifier:
        slot_uri: schema:identifier
        annotations:
          severity: SHOULD
          or_union: "datatype:xsd:string|nodeKind:sh:IRI|class:schema:PropertyValue"
          message: "Add a schema:identifier (e.g., InChIKey, CAS, PubChem CID, or a PropertyValue carrying its scheme) resolving the compound to an authoritative resource"
      molent_inChIKey:
        slot_uri: schema:inChIKey
        annotations:
          severity: SHOULD
          sh_datatype: xsd:string
          message: "Add schema:inChIKey (xsd:string) — the hashed InChI for unambiguous structure lookup"
      molent_smiles:
        slot_uri: schema:smiles
        annotations:
          severity: SHOULD
          sh_datatype: xsd:string
          message: "Add schema:smiles (xsd:string) for the compound structure"
      # MAY
      molent_inChI:
        slot_uri: schema:inChI
        annotations:
          severity: MAY
          sh_datatype: xsd:string
          message: "Add schema:inChI (xsd:string) for the compound structure"
      molent_molecularFormula:
        slot_uri: schema:molecularFormula
        annotations:
          severity: MAY
          sh_datatype: xsd:string
          message: "Add schema:molecularFormula (xsd:string) for the compound"
      molent_url:
        slot_uri: schema:url
        annotations:
          severity: MAY
          node_kind: sh:IRI
          message: "Add a schema:url (IRI) linking to an external entry (e.g., PubChem, ChEBI, CompoundWiki)"

  # --------------------------------------------------------------------------
  # CellLineSample — the cell-based test system
  # From tox.py: CellLineSample
  # The cell-based test system is represented by a Sample carrying a categorical
  # annotation via schema:sampleType (a DefinedTerm) and a cell-line identity via
  # schema:identifier resolved to a Cellosaurus accession. Discriminated by
  # schema:additionalType = "CellLine" (the ISA-profile additionalType
  # convention) so intermediate derived Samples are not constrained by it.
  # --------------------------------------------------------------------------
  CellLineSample:
    class_uri: bioschemas:Sample
    description: "The cell-based test system (e.g., a cell line) in a toxicology study"
    annotations:
      target_class: bioschemas:Sample
      discriminator_path: schema:additionalType
      discriminator_value: CellLine
      shape_name: CellLineSampleShape
      shape_prefix: tox
    attributes:
      cellsample_additionalType:
        slot_uri: schema:additionalType
        annotations:
          severity: MUST
          has_value: CellLine
          min_count: 1
          message: "Set schema:additionalType to 'CellLine' (xsd:string) to identify this Sample as the cell-based test system"
      cellsample_sampleType:
        slot_uri: schema:sampleType
        annotations:
          severity: MUST
          min_count: 1
          sh_class: schema:DefinedTerm
          message: "Add schema:sampleType as a schema:DefinedTerm categorising the test system (e.g., 'cell line')"
      # SHOULD
      cellsample_identifier:
        slot_uri: schema:identifier
        annotations:
          severity: SHOULD
          or_union: "datatype:xsd:string|nodeKind:sh:IRI|class:schema:PropertyValue"
          message: "Add a schema:identifier resolving the cell line to a Cellosaurus accession (e.g., CVCL_0027)"
      cellsample_additionalProperty:
        slot_uri: schema:additionalProperty
        annotations:
          severity: SHOULD
          sh_class: schema:PropertyValue
          message: "Add schema:additionalProperty linking to schema:PropertyValue entities for characteristics (e.g., passage number, growth conditions)"
      # MAY
      cellsample_url:
        slot_uri: schema:url
        annotations:
          severity: MAY
          node_kind: sh:IRI
          message: "Add a schema:url (IRI) linking to the Cellosaurus entry"

  # --------------------------------------------------------------------------
  # LabProcess - Exposure
  # From tox.py: LabProcessExposure
  # Exposing a biological system to a chemical substance.
  # Required parameterValues: Exposure Duration, Cell Seeding Density, Microplate
  # --------------------------------------------------------------------------
  LabProcessExposure:
    class_uri: bioschemas:LabProcess
    description: "An exposure process in a toxicology study"
    annotations:
      target_class: bioschemas:LabProcess
      discriminator_path: schema:additionalType
      discriminator_value: Exposure
      shape_name: LabProcessExposureShape
      shape_prefix: tox
    attributes:
      exposure_additionalType:
        slot_uri: schema:additionalType
        annotations:
          severity: MUST
          has_value: Exposure
          min_count: 1
          message: "Set schema:additionalType to 'Exposure' (xsd:string) to identify this LabProcess as an exposure step"
      exposure_object:
        slot_uri: schema:object
        annotations:
          severity: MUST
          min_count: 1
          message: "Add at least one schema:object linking to bioschemas:Sample or schema:MediaObject input entities being exposed"
      exposure_parameterValue:
        slot_uri: schema:additionalProperty
        annotations:
          severity: MUST
          min_count: 1
          message: "Add at least one schema:additionalProperty linking to schema:PropertyValue entities (e.g., Exposure Duration, Cell Seeding Density, Microplate)"
      # SHOULD
      exposure_result:
        slot_uri: schema:result
        annotations:
          severity: SHOULD
          class_union: "bioschemas:Sample|schema:MediaObject"
          message: "Add schema:result linking to bioschemas:Sample or schema:MediaObject output entities (exposed samples)"
      exposure_executesLabProtocol:
        slot_uri: bioschemas:executesLabProtocol
        annotations:
          severity: SHOULD
          sh_class: bioschemas:LabProtocol
          message: "Add bioschemas:executesLabProtocol linking to the bioschemas:LabProtocol this exposure executes"

  # --------------------------------------------------------------------------
  # LabProcess - EndpointReadout
  # From tox.py: LabProcessEndpointReadout
  # Measurement process capturing assay endpoint data.
  # Required parameterValues: Detection Instrument, Measured Entity, Endpoint, etc.
  # --------------------------------------------------------------------------
  LabProcessEndpointReadout:
    class_uri: bioschemas:LabProcess
    description: "An endpoint readout process in a toxicology study"
    annotations:
      target_class: bioschemas:LabProcess
      discriminator_path: schema:additionalType
      discriminator_value: EndpointReadout
      shape_name: LabProcessEndpointReadoutShape
      shape_prefix: tox
    attributes:
      readout_additionalType:
        slot_uri: schema:additionalType
        annotations:
          severity: MUST
          has_value: EndpointReadout
          min_count: 1
          message: "Set schema:additionalType to 'EndpointReadout' (xsd:string) to identify this LabProcess as a measurement readout"
      readout_result:
        slot_uri: schema:result
        annotations:
          severity: MUST
          min_count: 1
          message: "Add at least one schema:result linking to schema:MediaObject output data files"
      readout_parameterValue:
        slot_uri: schema:additionalProperty
        annotations:
          severity: MUST
          min_count: 1
          message: "Add at least one schema:additionalProperty linking to schema:PropertyValue entities (e.g., Detection Instrument, Endpoint, Measured Entity)"
      # SHOULD
      readout_object:
        slot_uri: schema:object
        annotations:
          severity: SHOULD
          class_union: "bioschemas:Sample|schema:MediaObject"
          message: "Add schema:object linking to bioschemas:Sample or schema:MediaObject input entities being measured"
      readout_executesLabProtocol:
        slot_uri: bioschemas:executesLabProtocol
        annotations:
          severity: SHOULD
          sh_class: bioschemas:LabProtocol
          message: "Add bioschemas:executesLabProtocol linking to the bioschemas:LabProtocol this readout executes"

  # --------------------------------------------------------------------------
  # LabProcess - CellCulture
  # From tox.py: LabProcessCellCulture
  # Cell culture maintenance process.
  # Required parameterValue: Culture Medium
  # --------------------------------------------------------------------------
  LabProcessCellCulture:
    class_uri: bioschemas:LabProcess
    description: "A cell culture process in a toxicology study"
    annotations:
      target_class: bioschemas:LabProcess
      discriminator_path: schema:additionalType
      discriminator_value: CellCulture
      shape_name: LabProcessCellCultureShape
      shape_prefix: tox
    attributes:
      cellculture_additionalType:
        slot_uri: schema:additionalType
        annotations:
          severity: MUST
          has_value: CellCulture
          min_count: 1
          message: "Set schema:additionalType to 'CellCulture' (xsd:string) to identify this LabProcess as a cell culture step"
      cellculture_object:
        slot_uri: schema:object
        annotations:
          severity: MUST
          min_count: 1
          message: "Add at least one schema:object linking to bioschemas:Sample input cell line entities"
      cellculture_result:
        slot_uri: schema:result
        annotations:
          severity: MUST
          min_count: 1
          message: "Add at least one schema:result linking to bioschemas:Sample output cultured sample entities"
      cellculture_parameterValue:
        slot_uri: schema:additionalProperty
        annotations:
          severity: MUST
          min_count: 1
          message: "Add at least one schema:additionalProperty linking to schema:PropertyValue entities (e.g., Culture Medium)"
      # SHOULD
      cellculture_executesLabProtocol:
        slot_uri: bioschemas:executesLabProtocol
        annotations:
          severity: SHOULD
          sh_class: bioschemas:LabProtocol
          message: "Add bioschemas:executesLabProtocol linking to the bioschemas:LabProtocol this cell culture executes"

  # --------------------------------------------------------------------------
  # LabProcess - DataAnalysis
  # From tox.py: LabProcessDataAnalysis
  # The processing pipeline that turns raw endpoint measurements into reported
  # results. Consumes the EndpointReadout's raw-data File(s) and emits the
  # processed-data File(s) along the derivation graph.
  # Required parameterValues: Data Calculation and Statistics, Computational Tool
  # --------------------------------------------------------------------------
  LabProcessDataAnalysis:
    class_uri: bioschemas:LabProcess
    description: "A data analysis process in a toxicology study"
    annotations:
      target_class: bioschemas:LabProcess
      discriminator_path: schema:additionalType
      discriminator_value: DataAnalysis
      shape_name: LabProcessDataAnalysisShape
      shape_prefix: tox
    attributes:
      dataanalysis_additionalType:
        slot_uri: schema:additionalType
        annotations:
          severity: MUST
          has_value: DataAnalysis
          min_count: 1
          message: "Set schema:additionalType to 'DataAnalysis' (xsd:string) to identify this LabProcess as a data analysis step"
      dataanalysis_object:
        slot_uri: schema:object
        annotations:
          severity: MUST
          min_count: 1
          message: "Add at least one schema:object linking to the raw-data schema:MediaObject (or bioschemas:Sample) inputs being analysed"
      dataanalysis_result:
        slot_uri: schema:result
        annotations:
          severity: MUST
          min_count: 1
          message: "Add at least one schema:result linking to the processed-data schema:MediaObject output files"
      dataanalysis_parameterValue:
        # schema:additionalProperty (NOT schema:parameterValue — that is not a real
        # schema.org term; the data + context.py + the other LabProcess shapes all use
        # additionalProperty). The mismatch was masked while the discriminator never fired.
        slot_uri: schema:additionalProperty
        annotations:
          severity: MUST
          min_count: 1
          message: "Add at least one schema:additionalProperty linking to schema:PropertyValue entities (e.g., Data Calculation and Statistics, Computational Tool)"
      # SHOULD
      dataanalysis_executesLabProtocol:
        slot_uri: bioschemas:executesLabProtocol
        annotations:
          severity: SHOULD
          sh_class: bioschemas:LabProtocol
          message: "Add bioschemas:executesLabProtocol linking to the bioschemas:LabProtocol this data analysis executes"
