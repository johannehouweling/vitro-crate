# Crate-intrinsic FAIR indicator cross-walk.
#
# A curated subset of the RDA FAIR Data Maturity Model indicators that can be assessed
# *intrinsically* from a single RO-Crate (its ro-crate-metadata.json @graph + files on
# disk), with no repository/registry/protocol context. Accessibility (A) is almost
# entirely protocol/hosting-level and therefore reported as out-of-scope, not failed.
#
# Sources (all CC-BY; cited in the generated report):
#   RDA   FAIR Data Maturity Model — Bahim et al. 2020, doi:10.5334/dsj-2020-041;
#         specification & guidelines v0.90, doi:10.15497/rda00050
#   DSM   FAIRplus Data Stewardship Maturity Model — https://fairplus.github.io/Data-Maturity/
#   NSDRA Nanosafety data reusability — Ammar et al. 2024, doi:10.1038/s41597-024-03324-x.
#         A parallel community-reporting instrument (281 indicators across nano
#         physicochemical / in-vitro / in-vivo groups). Its in-vitro group OVERLAPS our
#         MIT in-vitro core (~dose, duration, controls, replicates, passage, analysis) but
#         is NOT identical (NSDRA adds nano + in-vivo; MIT adds cell-line identity,
#         endpoint, instrument). R1.3 therefore delegates to MIT (Elberskirch) coverage as
#         the community-standard check, citing NSDRA as the parallel nanosafety lineage.

sources:
  rda:
    name: "RDA FAIR Data Maturity Model"
    citation: "Bahim et al. 2020, Data Science Journal 19(1):41"
    doi: "10.15497/rda00050"
  dsm:
    name: "FAIRplus Data Stewardship Maturity Model"
    url: "https://fairplus.github.io/Data-Maturity/"
  nsdra:
    name: "Nanosafety data reusability (NSDRA)"
    citation: "Ammar, Evelo & Willighagen 2024, Scientific Data 11:503"
    doi: "10.1038/s41597-024-03324-x"

# The DSM content+representation maturity level is computed faithfully from the actual
# FAIRplus DSM indicators in profiles/fair/dsm_indicators.yaml (see core/dsm.py).

indicators:
  # --- Findable ---
  - { id: RDA-F1-02M, dimension: F, priority: essential, check: root_global_id,
      text: "Metadata is identified by a globally unique identifier" }
  - { id: RDA-F1-02D, dimension: F, priority: essential, check: every_entity_has_id,
      text: "Data is identified by a globally unique identifier" }
  - { id: RDA-F1-01M, dimension: F, priority: essential, check: pid_form,
      text: "Metadata is identified by a persistent identifier" }
  - { id: RDA-F2-01M, dimension: F, priority: essential, check: rich_metadata,
      text: "Rich metadata is provided to allow discovery" }
  - { id: RDA-F3-01M, dimension: F, priority: essential, check: metadata_refs_data,
      text: "Metadata includes the identifier for the data" }
  # --- Accessible (intrinsically out-of-scope: protocol / repository level) ---
  - { id: RDA-A1-02M, dimension: A, priority: essential, scope: out_of_scope,
      text: "Metadata can be accessed manually (protocol/hosting-level)" }
  - { id: RDA-A1-04D, dimension: A, priority: essential, scope: out_of_scope,
      text: "Data is accessible through a standardised protocol (hosting-level)" }
  - { id: RDA-A2-01M, dimension: A, priority: essential, scope: out_of_scope,
      text: "Metadata remains available after data is gone (repository guarantee)" }
  # --- Interoperable ---
  - { id: RDA-I1-01M, dimension: I, priority: important, check: jsonld_context,
      text: "Metadata uses a knowledge representation in a standardised format" }
  - { id: RDA-I1-02M, dimension: I, priority: important, check: jsonld_context,
      text: "Metadata uses a machine-understandable knowledge representation" }
  - { id: RDA-I2-01M, dimension: I, priority: important, check: fair_vocabularies,
      text: "Metadata uses FAIR-compliant vocabularies" }
  - { id: RDA-I3-01M, dimension: I, priority: important, check: qualified_refs,
      text: "Metadata includes references to other metadata" }
  - { id: RDA-I3-03M, dimension: I, priority: important, check: qualified_refs,
      text: "Metadata includes qualified references to other metadata" }
  # --- Reusable ---
  - { id: RDA-R1-01M, dimension: R, priority: essential, check: reuse_attributes,
      text: "A plurality of accurate, relevant attributes is provided for reuse" }
  - { id: RDA-R1.1-01M, dimension: R, priority: essential, check: license_present,
      text: "Metadata includes information about the reuse licence" }
  - { id: RDA-R1.1-02M, dimension: R, priority: important, check: license_standard,
      text: "Metadata refers to a standard reuse licence" }
  - { id: RDA-R1.1-03M, dimension: R, priority: important, check: license_machine,
      text: "Metadata refers to a machine-understandable reuse licence" }
  - { id: RDA-R1.2-01M, dimension: R, priority: important, check: provenance,
      text: "Metadata includes provenance per community standards" }
  - { id: RDA-R1.3-01M, dimension: R, priority: essential, check: conforms_to_profile,
      text: "Metadata complies with a community standard (RO-Crate/ISA profile)" }
  - { id: RDA-R1.3-02M, dimension: R, priority: essential, check: conforms_to_profile,
      text: "Metadata is expressed per a machine-understandable community standard" }
  - { id: RDA-R1.3-01D, dimension: R, priority: essential, check: mit_coverage,
      text: "Data complies with a community reporting standard (MIT in-vitro coverage; cf. NSDRA nanosafety)" }
