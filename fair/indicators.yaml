# GENERATED FILE — do not edit by hand.
#
# Regenerate with:  uv run python scripts/gen_fair_indicators.py
#
# The FAIR indicator definitions (dimension / priority / text) are derived from the
# vendored RDA FAIR Data Maturity Model spreadsheet (fair/rda_fdmm.xlsx,
# doi:10.15497/rda00050, CC-BY-4.0). The local scope/check mapping (which indicators
# are assessed intrinsically from one RO-Crate, and with which check) lives in
# scripts/gen_fair_indicators.py. Accessibility indicators are protocol/repository
# level and reported out-of-scope, not failed. R1.3-01D delegates to MIT
# in-vitro coverage. The FAIRplus DSM ladder is generated separately into
# fair/dsm_indicators.yaml by scripts/gen_dsm_indicators.py.
#
# ALL 41 published indicators are carried, including the ones this tool cannot answer.
# Each of those states WHY, as `scope: out_of_scope` plus a `reason`. Omitting them
# made a coverage figure overstate itself: "14 of 21 met" reads as coverage of the
# model when it is really 14 of 41 with 20 never asked.

sources:
  rda:
    name: RDA FAIR Data Maturity Model
    specification:
      name: 'FAIR Data Maturity Model: specification and guidelines'
      publisher: Research Data Alliance
      doi: 10.15497/rda00050
      url: https://doi.org/10.15497/rda00050
      year: 2020
    peer_reviewed:
      citation: 'Bahim C, Casorrán-Amilburu C, Dekkers M, Herczog E, Loozen N, Repanas K, Russell K, Stall
        S. The FAIR Data Maturity Model: An Approach to Harmonise FAIR Assessments. Data Science Journal
        19(1):41 (2020)'
      doi: 10.5334/dsj-2020-041
    distribution: FAIR_evaluation_levels_v0.02.xlsx (sheet 'FAIR Indicators_v0.05'), Zenodo record 3909563
      — vendored as fair/rda_fdmm.xlsx, byte-identical to the published file (md5 b6231346dff874a3675747ab3e295fd9)
    license: CC-BY-4.0
    retrieved: '2026-07-25'
  dsm:
    name: FAIRplus Dataset Maturity Model (DSM)
    url: https://fairplus.github.io/Data-Maturity/
    note: Generated from the vendored assessment workbook by scripts/gen_dsm_indicators.py into fair/dsm_indicators.yaml,
      and scored by builder/tools/fair_assessment.py.
  nsdra:
    name: Nanosafety data reusability (NSDRA)
    citation: Ammar, Evelo & Willighagen 2024, Scientific Data 11:503
    doi: 10.1038/s41597-024-03324-x
scoring:
  metric:
  - 0 – not applicable
  - 1 – not being considered this yet
  - 2 – under consideration or in planning phase
  - 3 – in implementation phase
  - 4 – fully implemented
  per_indicator:
    cell: '''FAIR Indicators_v0.05''!J2'
    formula: =IF(OR($H2=DATA!$L$1,$H2=DATA!$L$2,$H2=DATA!$L$3,$H2=DATA!$L$4,$H2=0),0,1)
    note: Only '4 - fully implemented' scores 1. Every partial state scores 0, and so does a blank — the
      trailing $H2=0 term. This tool's met/failed verdict is this column, not a coarsening of it.
  ladder:
    cell: calc!C13:F13
    formula: =IF(AND(C$7=C$6,C$9=C8,C$11=C$10),DATA!$E$6,IF(AND(C$7=C$6,C$9=C$8,C$11>=C$10/2),DATA!$E$5,IF(AND(C$7=C$6,C$9=C$8),DATA!$E$4,IF(AND(C$7=C$6,C$9>=C$8/2),DATA!$E$3,IF(C$7=C$6,DATA!$E$2,DATA!$E$1)))))
    areas:
    - FINDABLE
    - ACCESSIBLE
    - INTEROPERABLE
    - REUSABLE
    priorities:
    - Essential
    - Important
    - Useful
    levels:
    - name: Level 0
      definition: Not FAIR
    - name: Level 1
      definition: FAIR essential criteria only
    - name: Level 2
      definition: FAIR essential criteria + 50 % of important criteria
    - name: Level 3
      definition: FAIR essential criteria + 100% of important criteria
    - name: Level 4
      definition: FAIR essential criteria + 100% of important criteria + 50% of useful criteria
    - name: Level 5
      definition: FAIR essential criteria + 100% of important criteria + 100% of useful criteria
  published_output: one maturity level per FAIR area, from the met and total counts per priority tier
    within that area (calc!C6:F11)
  local_output: a met / failed / not-assessed count over all 41 indicators, and no level
  deviation_note: 'The ladder gates every level above 0 on ALL essential indicators in the area being
    met, and an indicator this tool reports out_of_scope can never be met. Measured on the model as carried:
    Accessibility is 12 of 12 out_of_scope, so its level would read 0 on every crate forever; Findability
    carries two out_of_scope essentials (RDA-F1-01D, RDA-F4-01M), so it could not reach Level 1 on a perfect
    crate. Publishing the ladder would report the hosting repository''s properties as the crate''s failure,
    which is the reading this tool refuses everywhere else. The substitution is a flat count — declared
    here rather than left to be inferred from a missing key.'
