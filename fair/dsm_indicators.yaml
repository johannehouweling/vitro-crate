    why: an unmapped column leaves a reuser guessing what the field records
  granularity: ''
  text: Dataset(s) content is harmonised against a designed-for-purpose Semantic Data Model
- id: DSM-4-C3
  level: 4
  category: C
  scope: full
  check: common_data_elements
  remedy:
    do: Map the majority of columns to ontology terms via `propertyUrl`, not only the ones you consider
      key.
    why: a column no shared term names cannot be joined to anyone else's table
  granularity: Dataset Fields
  rda_ref: RDA-I2-01D
  text: Key Dataset Fields are mapped to Common Data Elements as defined by the Semantic Data Model
- id: DSM-4-C4
  level: 4
  category: C
  scope: partial
  check: standard_identifiers
  remedy:
    do: Carry the Cellosaurus or DTXSID identifier onto every node the tables point at, the minted output
      Sample of each culture step included.
    why: a reuser cannot tell which cells the measured wells actually held
  granularity: Dataset Field Values
  text: Values for key Domain Entities reported in the Dataset(s) are standardised and assigned unique
    Standard Identifiers
