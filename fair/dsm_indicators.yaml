    Represetations suitable for data sharing and re-use
- id: DSM-4-R3
  level: 4
  category: R
  scope: partial
  check: semantic_model
  remedy:
    do: Describe at least one study entity — a sample, a protocol, an assay process — so the crate holds
      more than a file listing.
    why: a crate of packaging metadata alone tells a reuser nothing about the study
  granularity: Dataset
  text: A Semantic Data Model (Metadata) used for data harmonisation across Datasets is formally defined
    and represented using Linked Data Representations
- id: DSM-4-R4
  level: 4
  category: R
  scope: partial
  check: machine_interpretable
  remedy:
