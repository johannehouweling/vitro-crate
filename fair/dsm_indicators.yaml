indicators:
- id: DSM-0-C0
  level: 0
  category: C
  scope: na
  granularity: Dataset
  text: Dataset(s) are NOT Identifiable via Unique Identifiers
- id: DSM-0-C1
  level: 0
  category: C
  scope: na
  granularity: Project
  text: Metadata does NOT contain context-related information required to interpret the data
- id: DSM-0-C2
  level: 0
  category: C
  scope: na
  granularity: Dataset
  text: Dataset Descriptor does NOT include a reference to the Dataset it describes
- id: DSM-0-R1
  level: 0
  category: R
  scope: na
  granularity: Dataset
  text: Contextual Metadata is NOT formally represented in any form
- id: DSM-0-R2
  level: 0
  category: R
  scope: na
  granularity: Dataset
  text: No representation of Data purposed for sharing and re-use is available
- id: DSM-0-R3
  level: 0
  category: R
  scope: na
  granularity: Dataset
  text: Metadata is available but NOT formally represented in a structured Dataset Descriptor
- id: DSM-0-R4
  level: 0
  category: R
  scope: na
  granularity: Dataset
  text: Metadata is NOT available in a Machine Readable Format
- id: DSM-0-R5
  level: 0
  category: R
  scope: na
  granularity: Dataset
  text: Dataset(s) are NOT available in a Machine Readable Format
- id: DSM-0-H1
  level: 0
  category: H
  scope: na
  granularity: Storage Capability
  text: Data or metadata is hosted in non-accessible storage (e.g., personal desktop, local file system
    or archive)
- id: DSM-0-H2
  level: 0
  category: H
  scope: na
  granularity: Retrieval Capability
  text: Data or metadata is hosted in an accessible resource but with no retrieval capability
- id: DSM-0-H3
  level: 0
  category: H
  scope: na
  granularity: Search Capability
  text: Hosting enviornment does NOT offer searching capabilities to discover data or metadata
- id: DSM-1-C0
  level: 1
  category: C
  scope: full
  check: unique_id
  remedy:
    do: Mint a DOI for the deposit and record it on the root as `identifier`.
    why: a reader cannot cite the deposit or fetch it again once it leaves this crate
  granularity: Dataset
  rda_ref: RDA-F1-02D
  fairsfair_ref: FsF-F1-01D
  text: Each Dataset purposed for sharing and re-use is assigned a unique identifier
- id: DSM-1-C1
  level: 1
  category: C
  scope: full
  check: study_summary
  remedy:
    do: Write the root a `description` that says more than its name, and describe every Study Dataset.
    why: a reuser meets a named study with nothing said about what was done
  granularity: Project
  fairsfair_ref: FsF-F2-01M
  text: Dataset Descriptor(s) includes Descriptive Study/Project-Level summary information
- id: DSM-1-C2
  level: 1
  category: C
  scope: full
  check: dataset_metadata
  remedy:
    do: Give every Dataset the root gathers, the root included, its own name and description.
    why: a reuser opening a Dataset finds no statement of what it holds
  granularity: Dataset
  fairsfair_ref: FsF-F2-01M
  text: Dataset Descriptor(s) includes Identifying & Descriptive Dataset-Level metadata
- id: DSM-1-C3
  level: 1
  category: C
  scope: full
  check: access_info
  remedy:
    do: Record the repository accession for the deposit, so the descriptor says where the data can be
      got.
    why: a reuser holds the data with no handle for going back to the original deposit
  granularity: Dataset
  rda_ref: RDA-A1-01M
  fairsfair_ref: FsF-A1-01M
  text: Dataset Descriptor(s) contains access information for the Dataset
- id: DSM-1-R0
  level: 1
  category: R
  scope: full
  check: has_descriptor
  remedy:
    do: Name the deposit — set the crate's title, which is what the descriptor identifies it by.
    why: a reuser cannot tell one deposit's descriptor from another's
  granularity: Dataset
  text: Dataset Metadata is formally represented in the form of an Identifiable Dataset Descriptor
- id: DSM-1-R1
  level: 1
  category: R
  scope: full
  check: context_fields
  remedy:
    do: Draft the study's subjects into the crate — the cell lines, the test chemicals, the protocols.
    why: a reuser opens a container that records nothing but its own packaging
  granularity: ''
  text: Contextual Metadata is represented at summary level and reported in the Dataset Descriptor
- id: DSM-1-R2
  level: 1
  category: R
  scope: full
  check: dataset_hierarchy
  remedy:
    do: File each deposited file under an Assay or Study Dataset below the root, not on the root itself.
    why: a reuser cannot tell which study or assay a file belongs to
  granularity: Dataset
  text: Data intended for sharing and reuse have a purposely defined representation as Datasets
- id: DSM-1-R3
  level: 1
  category: R
  scope: full
  check: general_schema
  remedy:
    do: Fill `name`, `description`, `datePublished` and `license` on the Root Data Entity.
    why: a generic schema.org reader finds no title, terms or date for the deposit
  granularity: Dataset
  text: A representation of the Dataset Descriptor conforming to a relevant General Purpose Metadata Schema
    is available
- id: DSM-1-R4
  level: 1
  category: R
  scope: full
  check: descriptor_machine_readable
  remedy:
    do: Declare the RO-Crate profile IRI as `conformsTo` on `ro-crate-metadata.json`.
    why: a machine reading the file cannot tell which specification it follows
  granularity: Dataset
  rda_ref: RDA-I1-02M
  fairsfair_ref: FsF-F4-01M
  text: Dataset Descriptor is available in Machine Readable Format
- id: DSM-1-R5
  level: 1
  category: R
  scope: full
  check: data_machine_readable
  remedy:
    do: Deposit the tables as CSV, TSV or XLSX and declare each file's `encodingFormat`.
    why: software cannot read the numbers out of a PDF or an undeclared blob
  granularity: Dataset
  rda_ref: RDA-I1-02D
  text: Dataset(s) available in Machine Readable Format
- id: DSM-1-H1
  level: 1
  category: H
  scope: na
  granularity: Storage Capability
  rda_ref: RDA-F1-01M, RDA-F1-01D
  text: Metadata hosting environment stores and maintains an identifiable Dataset Descriptor for each
    identifiable Dataset
- id: DSM-1-H2
  level: 1
  category: H
  scope: na
  granularity: Retrieval Capability
  rda_ref: RDA-A1-03M, RDA-A1-03D
  fairsfair_ref: FsF-F1-02D
  text: The Dataset and its Descriptor are indexed and retrievable (in the same or separate hosting environments)
    via unique and persistent identifiers
- id: DSM-1-H3
  level: 1
  category: H
  scope: na
  granularity: Retrieval Capability
  rda_ref: RDA-A1.1-01D
  text: Retrieval of the Dataset and the Dataset Descriptor utilises a standardized communication protocol
    that is open, free and universally implementable
- id: DSM-1-H4
  level: 1
  category: H
  scope: na
  granularity: Search Capability
  text: Metadata hosting environment offers the capability to browse and search contents of the Dataset
    Descriptor
- id: DSM-2-C1
  level: 2
  category: C
  scope: partial
  check: domain_model
  remedy:
    do: Write the study design, and how its datasets relate, into the root's `description`.
    why: a reuser cannot tell what the study did or how its files fit together
  granularity: Project
  rda_ref: RDA-R1-01M
  fairsfair_ref: FsF-R1-01MD
  text: The locally defined Domain Model contains concepts that describes the overall project/study design,
    the relationships between the Datasets, the key entities reported within the Datasets and the relationships
    between them.
- id: DSM-2-C2
  level: 2
  category: C
  scope: partial
  check: tidy_dataset
  remedy:
    do: Declare a `datatype` on every `csvw:Column`, and describe at least two columns in all.
    why: an untyped column is an undifferentiated string to every tool that reads it
  granularity: Dataset
  rda_ref: RDA-F1-02D
  fairsfair_ref: FsF-F1-01D
  text: Where applicable, data is structured in the Dataset according to the Tidy Data Principles
- id: DSM-2-C3
  level: 2
  category: C
  scope: full
  check: reference_fields
  remedy:
    do: Give at least one column a `valueUrl` pointing at the Sample or MolecularEntity its values name.
    why: a reuser cannot join the table's rows to the samples and compounds measured
  granularity: Dataset Fields
  text: Dataset(s) include Reference Fields that enable joining related datasets
- id: DSM-2-C4
  level: 2
  category: C
  scope: partial
  check: local_data_dictionary
  remedy:
    do: Give at least one column both a `datatype` and a `valueUrl` or `propertyUrl` naming its vocabulary.
    why: a reuser has to guess what the codes in a column stand for
  granularity: Dataset Field Values
  text: Where applicable, Dataset Field Values are standardized against a locally defined Data Dictionary
    within and across related Datasets
- id: DSM-2-C5
  level: 2
  category: C
  scope: full
  check: cross_dataset_refs
  remedy:
    do: Hang the depositor's own files directly under at least two Datasets the root relates to.
    why: a reuser cannot see which datasets the deposit holds, or how they join
  granularity: ''
  text: Dataset Descriptor includes reference to related Datasets and if applicable the relevant joining
    Dataset Fields
- id: DSM-2-C6
  level: 2
  category: C
  scope: full
  check: field_level_metadata
  remedy:
    do: Point every deposited table at a `tableSchema` listing one column per field, each with `titles`
      and a `datatype`.
    why: the deposit's tables arrive as bare headers a reader has to decode by hand
  granularity: Dataset Fields
  rda_ref: RDA-F2-01M
  fairsfair_ref: FsF-R1-01MD
  text: Dataset Descriptor includes Field-level Metadata as prescribed by a locally defined Dataset Model
- id: DSM-2-C7
  level: 2
  category: C
  scope: full
  check: value_level_metadata
  remedy:
    do: Record at least two property values on at least one entity in the crate.
    why: an entity carrying a single value states nothing a reuser can interpret
  granularity: Dataset Field Values
  text: Dataset Descriptor includes Value-level Metadata or if applicable includes a reference to a locally
    defined Data Dictionary
- id: DSM-2-R1
  level: 2
  category: R
  scope: partial
  check: domain_model
  remedy:
    do: 'Fill the root''s `description` with the project''s contextual model: design, arms, endpoints.'
    why: the context that makes the numbers mean anything is nowhere in the crate
  granularity: Project
  text: Contextual Metadata is formally represented and reported in the form of a locally defined Domain
    Model
- id: DSM-2-R2
  level: 2
  category: R
  scope: full
  check: local_dataset_model
  remedy:
    do: Declare a `tableSchema` on at least one data table in the crate.
    why: a reuser opening the CSV has no column list to read the numbers against
  granularity: Dataset
  text: Dataset(s) are standardised to a locally defined Dataset Model suitable for data sharing and re-use
- id: DSM-2-R3
  level: 2
  category: R
  scope: full
  check: generic_model
  remedy:
    do: Record at least one entity — a sample, a compound, an assay — before exporting.
    why: an empty descriptor models no data at all
  granularity: Dataset
  rda_ref: RDA-R1.3-02M
  text: Dataset Descriptor(s) adopt a Metadata Schema representation that describes the locally defined
    Dataset Model including its structural metadata (i.e. Field-level and Value-level metadata)
- id: DSM-2-R4
  level: 2
  category: R
  scope: partial
  check: model_documentation_human
  remedy:
    do: Write a `description` on at least one LabProtocol, not just its name.
    why: a reuser gets a protocol title and no account of what was done
  granularity: Dataset
  text: A formal documentation of the locally defined Domain Model is available in a Human Readable Format
- id: DSM-2-R5
  level: 2
  category: R
  scope: full
  check: data_structured
  remedy:
    do: Give every deposited file a specific `encodingFormat` rather than none or `application/octet-stream`,
      and leave no Dataset with an empty `hasPart`.
    why: a machine cannot tell how to open the file, and a promised dataset turns out empty
  granularity: Dataset
  rda_ref: RDA-I1-02D
  text: Dataset(s) available in Machine Readable Format
- id: DSM-2-H1
  level: 2
  category: H
  scope: na
