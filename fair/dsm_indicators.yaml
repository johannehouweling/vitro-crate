    Machine Interptretable format
- id: DSM-4-R5
  level: 4
  category: R
  scope: partial
  check: machine_interpretable_graph
  remedy:
    do: Bind each column's `propertyUrl` to an external ontology IRI.
    why: a reuser's software cannot tell what any column measures
  granularity: ''
  text: Datasets are available in a Machine Readable and Machine Interpretable format
- id: DSM-4-R6
  level: 4
  category: R
  scope: full
  check: license_machine
  remedy:
    do: Set the root's `license` to the licence URL itself, not a label like "CC-BY".
    why: a bare label does not say which version governs reuse
  granularity: Dataset Fields
  text: If applicable, license information and/or permitted use and accessability to parts of the dataset
    is formally represented and encoded in a Machine Readable Format
