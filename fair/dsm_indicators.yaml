- id: DSM-3-C2
  level: 3
  category: C
  scope: partial
  check: community_domain_model
  remedy:
    do: Declare the community profile the datasets follow in the root's `conformsTo`.
    why: a reader cannot tell which community guideline the datasets were reported under
  granularity: Dataset
  rda_ref: RDA-R1.3-01D
  text: Where applicable, Dataset(s) definition and content are reported in compliance with relevant community-defined
    Data Reporting Guidelines
- id: DSM-3-C3
  level: 3
  category: C
  scope: full
  check: standard_field_names
  remedy:
    do: Give each column a `propertyUrl` that is an absolute ontology IRI, not a local name.
    why: a reuser cannot tell what a column heading means across datasets
  granularity: ''
  text: Where applicable, Dataset Field Names use standard controlled terms as recommended by the adopted
    Standard
- id: DSM-3-C4
  level: 3
  category: C
  scope: partial
  check: controlled_values
  remedy:
    do: Bind every MolecularEntity and cell-line Sample to a registry IRI via `@id`, `identifier`, `sameAs`
      or `url`.
    why: a reuser cannot tell which cell line or compound was actually used
  granularity: Dataset Field Values
  rda_ref: RDA-I2-01D
  text: Where applicable, Dataset Field Values are standardised against domain-specific Controlled Terminologies
    and/or Ontology Terms
- id: DSM-3-C5
  level: 3
  category: C
  scope: full
  check: resolvable_terms
  remedy:
    do: Give a reported term — cell line, compound, AOP — a `url` or `sameAs` holding the full registry
      link, not a bare accession.
    why: a reuser cannot look up the term behind a bare label
  granularity: ''
  rda_ref: RDA-I2-01D
  text: Value Level Metadata includes Resolvable Identifiers for Controlled and/or Standard Terms reported
    in the Dataset
- id: DSM-3-C6
  level: 3
  category: C
  scope: partial
  check: standard_field_metadata
  remedy:
    do: Write the per-well design rows into the condition table, so the CSV carries records and not only
      a header.
    why: a schema over an empty table tells a reuser nothing about the data
  granularity: ''
  text: Dataset Descriptor includes standard-compliant Field-level Metadata as prescribed by the adopted
    standard Dataset Model.
- id: DSM-3-C7
  level: 3
  category: C
  scope: full
  check: standard_license
  remedy:
    do: Set the root's `license` to a standard licence URL — a Creative Commons, SPDX or OSI IRI.
    why: nobody may legally reuse the data without one
  granularity: ''
  text: Dataset Descriptor references a standard license under which the dataset can be re-used.
- id: DSM-3-R1
  level: 3
  category: R
  scope: partial
  check: community_domain_model
  remedy:
    do: Declare in the root's `conformsTo` the community standard the contextual metadata follows.
    why: a reuser cannot tell which standard the context was modelled against
  granularity: Project
  rda_ref: RDA-R1.3-01M
  fairsfair_ref: FsF-R1.3-01M
  text: Contextual Metadata is formally represented and modeled according to a community or domain-specific
    standard
- id: DSM-3-R2
  level: 3
  category: R
  scope: full
  check: local_dataset_model
  remedy:
    do: Attach a `csvw:tableSchema` to the crate's tabular data files.
    why: a reuser cannot parse the columns without a declared schema
  granularity: Dataset
  rda_ref: RDA-R1.3-01D
  text: Dataset(s) are standardised to relevant Domain or Community Standard Dataset Model(s) suitable
    for data sharing and re-use
- id: DSM-3-R3
  level: 3
  category: R
  scope: full
  check: domain_standard
  remedy:
    do: Declare a domain profile IRI in the root's `conformsTo` alongside the RO-Crate one.
    why: a reader sees packaging conventions but no domain standard to read against
  granularity: Dataset
  rda_ref: RDA-R1.3-01M
  fairsfair_ref: FsF-R1.3-01M
  text: Dataset Descriptor(s) use community-defined or domain-specific metadata standard
- id: DSM-3-R4
  level: 3
  category: R
  scope: full
  check: community_domain_model
  remedy:
    do: Publish the adopted model as a resolvable profile IRI and declare it in `conformsTo`.
    why: a machine has no address to fetch the model the crate claims to follow
  granularity: ''
  text: A formal documentation of the adopted Standard Dataset Model is available in a Machine Readable
    Format
- id: DSM-3-R5
  level: 3
  category: R
  scope: full
  check: non_proprietary_format
  remedy:
    do: Deposit the data as CSV, TSV, JSON, XML, HDF5 or NetCDF and state that `encodingFormat`.
    why: a reuser needs licensed software to open .xlsx or .prism data
  granularity: Dataset
  rda_ref: RDA-I1-01D
  fairsfair_ref: FsF-R1.3-02D
  text: Dataset(s) available in non-proprietary Machine Readable Format as prescribed by a standard Dataset
    Model
