  level: 4
  category: R
  scope: full
  check: semantic_contextual_metadata
  remedy:
    do: Give every PropertyValue a `propertyID` that is a resolvable ontology IRI.
    why: a bare label tells a machine nothing about which property was recorded
  granularity: Dataset
  text: Contextual Metadata is formally represented by a set of semantically defined Common Data Elements
- id: DSM-4-R2
  level: 4
  category: R
  scope: partial
  check: linked_data
  remedy:
    do: Attach a `tableSchema` to every deposited CSV and set `propertyUrl` on each of its columns.
    why: an undescribed table cannot be queried or joined alongside other data
  granularity: Dataset
