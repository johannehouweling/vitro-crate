    - name: Accuracy
      id: accuracy
      description: 'Closeness of agreement between test method results and accepted reference values; measure of test method
        performance. Sub-metrics: sensitivity (proportion of positives correctly classified), specificity (proportion of negatives
        correctly classified), positive predictivity, negative predictivity, false positive rate, false negative rate. Prevalence
        (proportion of positives/negatives in the test set) provides context for interpreting these metrics. See GD 34 Annex
        I, p.54 §158.'
      synonyms:
      - concordance
      - predictive capacity
      alternative_definition: ''
      standards:
