    - name: Sample size
      id: sample_size
      description: 'Number of independent experimental units used for statistical analysis (the ''n'' that determines degrees
        of freedom and underpins statistical power). For in vitro studies, this is typically the number of biological replicates
        rather than technical replicates (pseudoreplicates). Pairs with `statistical_power`: power analysis requires sample
        size as input, and sample size is what power analysis prescribes. Distinct from `number_of_replicates` (generic replicate
        count) and `unit_of_analysis_for_each_dataset` (the type of unit). See GD 417 p.22 Table 2.1; p.29-30 Sec 2.3.1.'
      synonyms:
