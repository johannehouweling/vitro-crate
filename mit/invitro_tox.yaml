modules:
- id: general_information
  name: General Information
  sections:
  - id: null
    name: null
    parameters:
    - name: Experiment name
      id: experiment_name
      description: Short and descriptive title [OECD GD 211]
      synonyms:
      - Scientific issue
      - Assay name
      - Title
      alternative_definition: Descriptive full-text title [ToxTemp]
      standards:
        oecd_gd211: true
        lincs: false
        toxtemp: true
        nature: false
        oecd_gd34: true
        oecd_gd417: false
        oecd_oht201: false
      additional: false
      crate_slot: Investigation:name;Study:name;Assay:name
    - name: Study description
      id: study_description
      description: A description of why you did the experiment, what you hoped to see. This should be a 2-3 sentence description
        that would explain what this experiment is to someone other than you. [MIFlowCyt]
      synonyms:
      - Study purpose
      - Description
      - Summary
      - Abstract
      alternative_definition: Provide a summary of the assay features. E.g. “the effects of a chemical irritant on the opacity
        and permeability of a freshly isolated bovine cornea can be used to measure eye irritancy.” [OECD GD 211]
      standards:
        oecd_gd211: true
        lincs: false
        toxtemp: true
        nature: false
        oecd_gd34: false
        oecd_gd417: true
        oecd_oht201: true
      additional: false
      crate_slot: Study:description
    - name: Date
      id: date
      description: 'Report the date of the first version of the method decription (day/month/year). Example: “5 August 2013”
        [OECD GD 211]'
      synonyms:
      - Year
      - Date of the publication
      alternative_definition: ''
      standards:
        oecd_gd211: true
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: false
        oecd_gd417: false
        oecd_oht201: false
      additional: false
      crate_slot: Investigation:datePublished
    - name: Version number
      id: version_number
      description: Indicate the date (day/month/year) of any update of the MD. The MD can be updated for a number of reasons
        such as additions of new information or corrections to the existing information. Summarise briefly which information
        has been updated.  [OECD GD 211]. For protocols, semantic versioning and fork tracking via dynamic repositories (e.g.,
        protocols.io) are encouraged.
      synonyms: []
      alternative_definition: Version number and date of deposition; Summary of introduced changes in comparison to previous
        version(s) [ToxTemp]
      standards:
        oecd_gd211: true
        lincs: false
        toxtemp: true
        nature: false
        oecd_gd34: false
        oecd_gd417: true
        oecd_oht201: false
      additional: false
      crate_slot: Investigation:dateModified
    - name: Organizations
      id: organizations
      description: Organization(s) performing the experiment. [MIFlowCyt]
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: false
        oecd_gd417: false
        oecd_oht201: false
      additional: false
      crate_slot: Investigation:sourceOrganization
    - name: Experimenter(s)
      id: experimenters
      description: Name and email of contact person, Name of further persons involved [ToxTemp]. CRediT-style role attribution
        (conceptualisation, methodology, investigation, analysis, etc.) is encouraged.
      synonyms:
      - Corresponding person
      - Name and acronym of the test depositor
      alternative_definition: The scientist that performed this experiment. [4DN] Primary researcher [MIFlowCyt] Names and
        contact details [OECD GD 211] Assay developer(s)/Laboratory and contact details [OECD GD 211]
      standards:
        oecd_gd211: true
        lincs: false
        toxtemp: true
        nature: false
        oecd_gd34: false
        oecd_gd417: true
        oecd_oht201: false
      additional: false
      crate_slot: Investigation:author
    - name: Time point
      id: time_point
      description: Date and time (range) of the experiment [OECD GD 211]. Range form (start–end) is acceptable to capture
        the study time-frame.
      synonyms:
      - Study time-frame
      - study period start
      - study period end
      alternative_definition: ''
      standards:
        oecd_gd211: true
        lincs: false
        toxtemp: true
        nature: false
        oecd_gd34: true
        oecd_gd417: false
        oecd_oht201: true
      additional: false
      crate_slot: Study:temporalCoverage
    - name: Data access
      id: data_access
      description: 'Availability of data: e.g., open access or restricted data access'
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: false
        oecd_gd417: false
        oecd_oht201: true
      additional: false
      crate_slot: Investigation:conditionsOfAccess
      value_sets:
      - Z03
    - name: PubMed IDs
      id: pubmed_ids
      description: A numeric PubMed ID of a publication associated with this experiment or a comma-separated list on multiple
        numeric PubMed IDs if multiple publications are related to this experiment. [MIFlowCyt]
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: true
        oecd_gd417: false
        oecd_oht201: false
      additional: false
      crate_slot: Investigation:citation
    - name: PMC IDs
      id: pmc_ids
      description: A PMC publication identifier (i.e., PMCxxxxxxxx) of a publication associated with this experiment, or a
        comma-separated list of multiple PMC IDs if multiple publications are related to this experiment. [MIFlowCyt]
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: true
        oecd_gd417: false
        oecd_oht201: false
      additional: false
      crate_slot: Investigation:citation
    - name: DOI
      id: doi
      description: DOI stands for Digital Object Identifier. It is a unique ID to correspond to an electronic document such
        as an electronic journal article. Note, not all electronic journal articles have a DOI.  However, you may come across
        this ID on a journal article page, on a publisher's website, in a record in a database such as PubMed, or in a citation
        in a bibliography.  Some citation styles include the DOI at the end of the citation. [Health and science library].
        Protocol DOIs (e.g., from protocols.io) are valid uses of this field for citing the procedure itself.
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: true
        oecd_gd417: true
        oecd_oht201: false
      additional: true
      crate_slot: Investigation:citation
    - name: Reference(s) to main scientific papers
      id: references_to_main_scientific_papers
      description: List of bibliographic references to papers that explain assay development [OECD GD 211]
      synonyms:
      - References list
      alternative_definition: Availability of key publications [ToxTemp]
      standards:
        oecd_gd211: true
        lincs: false
        toxtemp: true
        nature: false
        oecd_gd34: true
        oecd_gd417: false
        oecd_oht201: true
      additional: false
      crate_slot: Investigation:citation
    - name: Test type
      id: test_type
      description: e.g., in vivo, or in vitro, ex vivo, in chemico, in silico
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: false
        oecd_gd417: false
        oecd_oht201: true
      additional: false
      crate_slot: Investigation:keywords
      value_sets:
      - IntEff_InfoType
    - name: Endpoint(s)
      id: endpoints
      description: Define the specific endpoint(s) of the test system that you use for toxicity testing (e.g., cytotoxicity,
        cell migration, etc.). Indicate whether cytotoxicity is the primary endpoint.What are secondary/further endpoints?Also
        describe here potential reference/normalization endpoints (e.g. cytotoxicity, protein content, housekeeping gene expression)
        that are used for normalization of the primary endpoint. [ToxTemp]
      synonyms: []
      alternative_definition: The recorded observation coming from an in chemico method, an in vitro assay or an in vivo assay
        [OECD]
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: true
        nature: false
        oecd_gd34: false
        oecd_gd417: true
        oecd_oht201: true
      additional: false
      crate_slot: Assay:char
      value_sets:
      - IntEff_AddAnalysis
    - name: Availability  of  information
      id: availability_of_information
      description: 'Indicate whether the assay is proprietary  or  non-proprietary  (to  what  extent  is  the  assay  method  transferable  or  contains
        proprietary  elements)  and  specify  (if  possible)  what  kind  of  information  about  the  assay  cannot  be disclosed  or  is  not  available  (e.g.,  chemical  reference  sets  (training  or  test  sets),  prediction  model).
        Example: “The assay is non-proprietary, but the training and test sets are not available”; “The model is proprietary,
        and the prediction model and associated data sets are confidential”; “Company XYZ’s in vitro model for sensitisation
        may be transferable but the prediction model is confidential”. Obviously ensuring scientific confidence in an assay
        is facilitated if all information is transparent and can be disclosed. [OECD GD 211]'
      synonyms:
      - Method transfer
      alternative_definition: ''
      standards:
        oecd_gd211: true
        lincs: false
        toxtemp: true
        nature: false
        oecd_gd34: true
        oecd_gd417: false
        oecd_oht201: false
      additional: false
      crate_slot: Study:char
    - name: Information about the throughput of the assay
      id: information_about_the_throughput_of_the_assay
      description: Indicate the throughput of the assay to provide an indication of likely resource intensity e.g., low (manual
        assay, one chemical tested at a time), lowmoderate, moderate, moderate-high, high throughput (e.g., in 96 well-plate
        and higher), and qualify with e.g., approximate number of chemicals/concentrations per run. If appropriate indicate
        whether a manual assay could be run in a higher throughput mode. [OECD GD 211]
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: true
        lincs: false
        toxtemp: true
        nature: false
        oecd_gd34: false
        oecd_gd417: false
        oecd_oht201: false
      additional: false
      crate_slot: Study:char
    - name: Status of the method
      id: status_of_the_method
      description: 'i)  Development  status:  Indicate  if  the  assay  is  still  under  development,  and  the  estimated  timeline  for
        completion as far as possible; ii) Known uses: summarise the current and/or past use of the assay by different laboratories;
        iii) Evaluation study: summarise the main conclusions or refer to individual protocol if available; iv)  Validation  study:  indicate  participation  in  a  formal  validation  study/studies  and  summarise  the
        conclusions and their outcomes or refer to the individual protocol if available; v)  Regulatory  use:  provide  details  of  any
        potential regulatory  application and  of  the toxicological hazard endpoint being addressed by the assay [OECD GD
        211] If applicable: what is the status of the standardised assay, research, new method etc., is there an (S)OP? Reference
        to the SOP'
      synonyms:
      - validation approach
      - prospective validation
      - retrospective validation
      - prevalidation
      alternative_definition: ''
      standards:
        oecd_gd211: true
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: true
        oecd_gd417: false
        oecd_oht201: false
      additional: false
      crate_slot: Study:char
    - name: Standards followed
      id: standards_followed
      description: Standards followed such as good cell culture practice [OECD GD 211] Information about qualifier, guideline,
        standards and deviations [OECD]
      synonyms:
      - GLP compliance statement
      - OECD TG alignment
      - OECD Test Guideline
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: true
        oecd_gd417: true
        oecd_oht201: true
      additional: false
      crate_slot: Investigation:char
      value_sets:
      - IntEff_Qualifier
      - IntEff_Method
      - Z40
      - IntEff_OtherQuality
    - name: Funding
      id: funding
      description: List all funding sources (including grant number) and the role of the funder(s) in the study. [ARRIVE]
      synonyms: []
      alternative_definition: You may reference funding sources for this experiment.  [MIFlowCyt]
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: false
        oecd_gd417: true
        oecd_oht201: false
      additional: false
      crate_slot: Investigation:funder
    - name: Abbreviations and definitions
      id: abbreviations_and_definitions
      description: Used abbrevations and definitions of specific terminology
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: true
        lincs: false
        toxtemp: true
        nature: false
        oecd_gd34: false
        oecd_gd417: false
        oecd_oht201: false
      additional: false
      crate_slot: Study:char
    - name: Supplementary Information
      id: supplementary_information
      description: Name of the attached document(s) with remarks about content
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: true
        oecd_gd417: false
        oecd_oht201: true
      additional: false
      crate_slot: Investigation:hasPart
      value_sets:
      - PG6-61157
    - name: Test method sponsor
      id: test_method_sponsor
      description: Entity that has proposed a test method for incorporation into a Test Guideline, responsible for organising
        and providing all available information to the validation/review body.
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: true
        oecd_gd417: false
        oecd_oht201: false
      additional: false
    - name: Submitting party / national coordinator
      id: submitting_party
      description: Party through which the test method is submitted to OECD (Member country NC, EU/EC, BIAC industry association,
        or invited expert via NC).
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: true
        oecd_gd417: false
        oecd_oht201: false
      additional: false
    - name: Submission date
      id: submission_date
      description: Date the test method submission package was provided for peer review / regulatory consideration.
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: true
        oecd_gd417: false
        oecd_oht201: false
      additional: false
    - name: Quality assurance / quality control procedures
      id: quality_assurance_procedures
      description: QA/QC procedures to which the original data and derived values are subjected; management process for adherence
        to laboratory testing standards.
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: true
        oecd_gd417: false
        oecd_oht201: false
      additional: false
    - name: Cost and time of conducting the test
      id: practical_considerations
      description: Cost and time involved in conducting a study using the proposed test method, compared to reference test
        method(s).
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: true
        oecd_gd417: false
        oecd_oht201: false
      additional: false
    - name: Peer review status
      id: peer_review_status
      description: Peer review is often a prerequisite for regulatory consideration of research data; reporting of peer-review
        status supports reliability assessment.
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: false
        oecd_gd417: true
        oecd_oht201: false
      additional: false
    - name: Pre-registration of protocol
      id: preregistration
      description: Pre-registration of protocols (e.g., in study registries such as clinical trial registries or animal study
        registries) reduces publication bias and increases transparency.
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: false
        oecd_gd417: true
        oecd_oht201: false
      additional: false
- id: chemical_information
  name: Chemical Information
  sections:
  - id: chemical_description_and_generation_procedure
    name: Chemical description and generation procedure
    parameters:
    - name: Compound name
      id: compound_name
      description: Used designation / name in the present work, standardized name of the nanomaterial (OECD)
      synonyms:
      - Material name
      - Nanomaterial
      - Compound designation
      - Substance
      - chemical name
      - formulation name
      - product name
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
        oecd_gd34: true
        oecd_gd417: true
        oecd_oht201: true
      additional: false
      crate_slot: MolecularEntity:name
      iri: http://purl.obolibrary.org/obo/NCIT_C96972
      iri_label: Chemical Name
      iri_predicate: skos:closeMatch
      iri_justification: semapv:ManualMappingCuration
      iri_source_version: ncit:26.02d
    - name: CAS Registry Number
      id: cas_registry_number
      description: It is a unique numeric identifier, designates only one substance, has no chemical significance, represents
        a link to a wealth of information about a specific chemical substance [CAS REGISTRY and CAS Registry Number FAQs]
      synonyms: []
      alternative_definition: ''
      standards:
        oecd_gd211: false
        lincs: false
        toxtemp: false
        nature: false
