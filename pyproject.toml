[project]
name = "vitro-crate"
version = "0.1.0"
description = "ISA-Tox RO-Crate Builder — LLM-assisted creation of profile-conformant RO-Crates for in vitro toxicology data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rocrate>=0.15.0",
    "roc-validator>=0.11.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.52",
    "watchfiles>=1.0.0",
    "langgraph>=1.2.6",
    "langchain>=1.3.10",
    "pypdf",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "cryptography>=41,<49",  # pinned below 46 to avoid missing DeprecatedIn46 in google-auth
    "frictionless>=5.19.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-openai>=1.3.2",
    "openai>=2.0,<2.43",  # pinned due to breaking OAuthErrorCode/WebSocketConnectionOptions changes in 2.20+
    "langchain-anthropic>=1",
]

[dependency-groups]
dev = [
    "hindsight-all>=0.8.3",
    "hindsight-cline>=0.2.0",
    "ty>=0.0.51",
    "pytest>=8.0",
    "pytest-cov>=7",
    "responses>=0.26.1",
    "ipykernel>=7.3.0",
    "nbformat>=5.10.4",
    "ruff>=0.15.18",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
line-length = 100
exclude = ["tests", "tests/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
