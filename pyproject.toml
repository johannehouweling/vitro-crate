[project]
name = "vitro-crate"
version = "0.1.0"
description = "ISA-Tox RO-Crate Builder — LLM-assisted creation of profile-conformant RO-Crates for in vitro toxicology data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "rocrate>=0.15.0",
    "roc-validator>=0.11.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    # Legacy BIFF .xls — openpyxl reads OOXML only, and the real deposit corpus
    # is full of pre-2007 workbooks (#417). Present transitively in the dev
    # group today, so it must be declared or a production install loses them.
    "xlrd>=2.0.1",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.52",
    "watchfiles>=1.0.0",
    "langgraph>=1.2.6",
    "langchain>=1.3.10",
    "pypdf",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "cryptography>=41",
    "frictionless>=5.19.0",
    # Not used directly — pinned because roc-validator declares `pyshacl>=0.26`
    # with no ceiling, and pyshacl 0.40.0 removed `ConjunctiveLike` from
    # `pyshacl.rdfutil.consts`, which roc-validator imports. The import error is
    # caught per check and logged as a WARNING, so validation does not fail — it
    # returns NO FINDINGS. A crate then validates "clean" because nothing ran,
    # which is the one failure this project cannot tolerate quietly. Raise the
    # ceiling only once roc-validator supports 0.40 (upstream declares no bound,
    # so nothing else will stop this recurring).
    "pyshacl>=0.26,<0.40",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
langchain = [
    "langchain-openai>=1.3.2",
    "openai>=2.0",
    "langchain-anthropic>=1",
]

[dependency-groups]
dev = [
    "ty>=0.0.51",
    "pytest>=8.0",
    "pytest-cov>=7",
    "responses>=0.26.1",
    "ipykernel>=7.3.0",
    "nbformat>=5.10.4",
    "ruff>=0.15.18",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pytest-split>=0.11.0",
    "mutmut>=3.6.0",
]

[tool.ruff]
line-length = 100
exclude = ["tests", "tests/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval/tests"]
python_files = ["test_*.py"]
# pytest-timeout's default `signal` method only fires on the main thread, so it
# never triggers inside pytest-xdist worker subprocesses. `thread` works in both
# serial and parallel runs, so set it globally for correct timeouts under xdist.
timeout_method = "thread"

[tool.mutmut]
# Mutation testing is the objective "would this test actually catch a regression"
# signal — line coverage does not measure it (a fully-covered suite can kill a
# fraction of injected bugs). Seeded on a small, fast-tested module so the nightly
# job (.github/workflows/mutation.yml) is tractable; expand `source_paths` to the
# crate-build producer modules (builder/agents/pipeline/pipeline.py,
# builder/tools/_crate_mapping.py, builder/tools/validation.py) with a curated fast
# test subset as the CI budget allows. See CONTRIBUTING.md "Mutation testing".
source_paths = ["builder/tools/profiler.py"]
pytest_add_cli_args_test_selection = ["tests/test_profiler.py"]
# mutmut runs each mutant in a copied `mutants/` sandbox; bring the rest of the
# importable project + the test tree along so imports and collection resolve there.
also_copy = ["builder", "profiles", "eval", "lookups", "tests", "conftest.py"]
